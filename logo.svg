<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Customize UI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2e"/>
      <stop offset="1" stop-color="#071019"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9dcff"/>
      <stop offset="1" stop-color="#5fb0e8"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fd7c0"/>
      <stop offset="1" stop-color="#7fc1f0"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="20%" r="80%">
      <stop offset="0" stop-color="#7fc1f0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7fc1f0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <rect width="128" height="128" rx="30" fill="url(#glow)"/>
  <!-- a window being themed: frame, title bar, two panes -->
  <rect x="24" y="30" width="80" height="68" rx="12" fill="#0b1624" stroke="url(#ice)" stroke-opacity=".55" stroke-width="2"/>
  <path d="M24 46h80" stroke="#7fc1f0" stroke-opacity=".35" stroke-width="1.5"/>
  <circle cx="35" cy="38" r="2.6" fill="#7fc1f0" fill-opacity=".9"/>
  <circle cx="44" cy="38" r="2.6" fill="#7fc1f0" fill-opacity=".55"/>
  <circle cx="53" cy="38" r="2.6" fill="#7fc1f0" fill-opacity=".3"/>
  <!-- sidebar menu -->
  <rect x="31" y="54" width="20" height="4" rx="2" fill="#9fd0f5" fill-opacity=".9"/>
  <rect x="31" y="63" width="16" height="4" rx="2" fill="#9fd0f5" fill-opacity=".5"/>
  <rect x="31" y="72" width="18" height="4" rx="2" fill="#9fd0f5" fill-opacity=".35"/>
  <rect x="31" y="81" width="13" height="4" rx="2" fill="#9fd0f5" fill-opacity=".25"/>
  <!-- the brush stroke: a cold gradient swoosh across the content pane -->
  <path d="M59 86c6-20 16-28 38-30" fill="none" stroke="url(#teal)" stroke-width="7" stroke-linecap="round"/>
  <path d="M59 86c6-20 16-28 38-30" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"/>
  <!-- locked field: the password box that stays -->
  <rect x="60" y="54" width="36" height="9" rx="4.5" fill="#102033" stroke="#7fc1f0" stroke-opacity=".6" stroke-width="1.5"/>
  <circle cx="66" cy="58.5" r="1.5" fill="#b9dcff"/><circle cx="72" cy="58.5" r="1.5" fill="#b9dcff"/><circle cx="78" cy="58.5" r="1.5" fill="#b9dcff"/>
  <path d="M89 57.3v-1.6a2.2 2.2 0 0 1 4.4 0v1.6" fill="none" stroke="#5fd7c0" stroke-width="1.3" stroke-linecap="round"/>
  <rect x="88" y="57.2" width="6.4" height="4.4" rx="1.2" fill="#5fd7c0"/>
</svg>
